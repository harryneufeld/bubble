# CI für den Relay: Tests laufen bei jeder Änderung, das Docker-Image wird (multi-arch: amd64 + arm64) gebaut.
# Veröffentlicht wird nur auf main und bei Tags `relay-v*`, nie aus Pull Requests.
#
# Image:  ghcr.io/<besitzer>/bubble-relay
#   :main        aktueller Stand von main
#   :sha-<kurz>  jeder veröffentlichte Commit
#   :latest      aktueller Stand von main
#   :1.2.3, :1.2 bei einem Tag relay-v1.2.3
#
# Hinweis: Ein neues GHCR-Paket ist zunächst privat. Zum Ziehen ohne Anmeldung (z. B. auf dem Pi) einmalig unter
# GitHub → Profil → Packages → bubble-relay → Package settings auf „Public“ stellen.
name: Relay

on:
  push:
    branches: [main]
    tags: ["relay-v*"]
    paths:
      - "src/Bubble.Relay/**"
      - "src/Bubble.Core/**"
      - "tests/**"
      - "compose.yaml"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "src/Bubble.Relay/**"
      - "src/Bubble.Core/**"
      - "tests/**"
      - "compose.yaml"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

# Ein laufender Build pro Branch; neuere Pushes ersetzen ältere.
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bubble-relay

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Die Live-Tests brauchen einen laufenden Relay und sind ohne BUBBLE_RELAY_URL übersprungen.
      - name: Test
        run: dotnet test tests/Bubble.Tests --nologo --verbosity minimal

  image:
    name: Docker-Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Emulation für arm64 (Raspberry Pi); gebaut wird per Cross-Kompilierung im Dockerfile, QEMU startet nur das Laufzeit-Image.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Beschriftung
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=relay-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=relay-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Bubble Relay
            org.opencontainers.image.description=Blinder Relay für Bubble: speichert nur verschlüsselte Daten

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Bubble.Relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
